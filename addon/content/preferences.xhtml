<!--
  addon/content/preferences.xhtml — 插件设置面板片段（XUL fragment）
  注意：fragment 不能带 <?xml ...?> 声明，否则 parseXULToFragment 报 "not well-formed XML"
  由 Zotero.PreferencePanes.register 加载（defaultXUL: true）。
  参照 Green Frog 模式：原生 XUL 元素（vbox/groupbox/hbox/checkbox/label/description），
  简单设置项用 preference 属性做 Zotero 原生偏好绑定（无需 JS）；
  MCP 开关、凭据按钮这类需要业务逻辑的保留最小 JS（preferences.js）。
  顶部 <linkset> 挂 Fluent 文件；静态文案用 data-l10n-id + 中文默认文本。
-->
<linkset xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
         xmlns:html="http://www.w3.org/1999/xhtml">
  <html:link rel="localization" href="skill-task.ftl"/>
</linkset>
<vbox id="zotero-prefpane-skill-task"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      onload="if (window.ZoteroSkillTaskPreferences) window.ZoteroSkillTaskPreferences.init();">

  <description id="st-prefs-boot">设置界面已加载，正在初始化…</description>

  <groupbox>
    <label><html:h2 data-l10n-id="skill-task-prefs-mcp-section">MCP 服务</html:h2></label>

    <!-- 需业务逻辑（启停要调 mcp.register/unregister），JS 驱动，不用 preference 绑定 -->
    <hbox align="center">
      <checkbox id="st-mcp-enabled" native="true"
                data-l10n-id="skill-task-prefs-mcp-enable" label="启用 MCP 服务"/>
    </hbox>

    <hbox align="center">
      <label data-l10n-id="skill-task-prefs-mcp-addr">服务地址</label>
      <label id="st-mcp-addr" style="font-family: monospace;">—</label>
      <button id="st-mcp-addr-copy"
              data-l10n-id="skill-task-prefs-addr-copy" label="复制"/>
    </hbox>

    <hbox align="center">
      <label data-l10n-id="skill-task-prefs-mcp-port">实际端口</label>
      <label id="st-mcp-port-value" style="font-family: monospace;">—</label>
    </hbox>
    <description data-l10n-id="skill-task-prefs-mcp-local-only">当前复用 Zotero Connector Server，仅支持本机 127.0.0.1 访问；不支持直接通过局域网 IP 连接。</description>

    <hbox align="center">
      <checkbox id="st-mcp-token-enabled" native="true"
                data-l10n-id="skill-task-prefs-token-enable" label="启用访问凭据（建议保持开启）"/>
    </hbox>

    <hbox align="center" id="st-mcp-token-row">
      <label data-l10n-id="skill-task-prefs-mcp-token">访问凭据</label>
      <label id="st-mcp-token-state">—</label>
      <button id="st-mcp-token-show"
              data-l10n-id="skill-task-prefs-token-show" label="显示并复制"/>
      <button id="st-mcp-token-regen"
              data-l10n-id="skill-task-prefs-token-regen" label="重新生成"/>
    </hbox>
    <html:input id="st-mcp-token-value" type="text" readonly="readonly" hidden="hidden"/>

    <description data-l10n-id="skill-task-prefs-token-hint">访问凭据默认启用；关闭后 MCP 接口将无需鉴权。重新生成会使旧凭据立即失效，请勿记入日志或随意分享。</description>
    <description id="st-err" hidden="true" style="color: #c00;"/>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="skill-task-prefs-task-section">任务默认</html:h2></label>

    <!-- 原生偏好绑定：修改直接写 Zotero.Prefs，业务侧每次读取，实时生效 -->
    <hbox align="center">
      <label data-l10n-id="skill-task-prefs-lease" for="st-lease-minutes">领取租约时长（分钟）</label>
      <html:input type="number" id="st-lease-minutes" min="1" max="1440" step="1"
                  preference="extensions.zotero-skill-task.task.leaseMinutes"/>
    </hbox>

    <hbox align="center">
      <label data-l10n-id="skill-task-prefs-maxfile" for="st-maxfile-mb">文件交付大小上限（MB）</label>
      <html:input type="number" id="st-maxfile-mb" min="1" step="1"
                  preference="extensions.zotero-skill-task.deliverable.maxFileMB"/>
    </hbox>

    <description data-l10n-id="skill-task-prefs-task-hint">修改实时生效，无需重启。</description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="skill-task-prefs-shortcut-section">快捷键</html:h2></label>
    <hbox align="center">
      <label id="st-shortcut-key" style="font-family: monospace;">Ctrl+Shift+J</label>
      <description data-l10n-id="skill-task-prefs-shortcut-desc">打开技能任务管理面板（输入框内不触发）</description>
    </hbox>

    <!-- 需求单 需求6：快捷键可配置化（JS 驱动：需校验 + 冲突提示） -->
    <hbox align="center">
      <checkbox id="st-shortcut-enabled" native="true"
                data-l10n-id="skill-task-prefs-shortcut-enable" label="启用面板快捷键"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="skill-task-prefs-shortcut-key-mac" for="st-shortcut-key-mac">按键（macOS，⌘+Shift+）</label>
      <html:input id="st-shortcut-key-mac" type="text" maxlength="1" size="2"
                  style="font-family: monospace; text-transform: uppercase;"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="skill-task-prefs-shortcut-key-win" for="st-shortcut-key-win">按键（Windows/Linux，Ctrl+Shift+）</label>
      <html:input id="st-shortcut-key-win" type="text" maxlength="1" size="2"
                  style="font-family: monospace; text-transform: uppercase;"/>
    </hbox>
    <description id="st-shortcut-warn" hidden="true" style="color: #b45309;"/>
    <description id="st-shortcut-err" hidden="true" style="color: #c00;"/>
    <description data-l10n-id="skill-task-prefs-shortcut-hint">单个字母或数字；修改实时生效，无需重启。</description>
  </groupbox>

</vbox>
