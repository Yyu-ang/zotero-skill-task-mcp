<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>技能任务 · Skill Task</title>
  <style>
    /* ══════════════════════════════════════════════════════════════
       技能任务面板设计令牌
       设计规则（全文统一执行）：
       1. 圆角：卡片/表单容器 10px · 按钮/输入框 6px · 徽章 pill(999px)
          · 状态分组 details 8px · 图标徽标(logo/empty) 8px/50%
       2. accent 全程只用 --accent 系；状态语义锁定 ok=绿 warn=琥珀
          danger=红 muted=灰，全面板统一（颜色+图标双通道）
       3. 图标：feather 风格 inline SVG，1.5px 描边，currentColor，
          按钮/行内 15px，徽章内 12px；禁用 emoji
       4. 动效只用 transform/opacity 的 transition（150–250ms，
          cubic-bezier(0.16,1,0.3,1)），每个动效对应：操作反馈 /
          状态变化 / 层级引导；prefers-reduced-motion 下全部关闭
       ══════════════════════════════════════════════════════════════ */
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #1f2329;
      --muted: #6b7280;
      --border: #dfe3e8;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-mid: rgba(37, 99, 235, 0.55);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.10);
      --ok: #16a34a;
      --ok-soft: rgba(22, 163, 74, 0.12);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.12);
      --input-bg: #ffffff;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191c20;
        --panel: #23272d;
        --text: #e8eaed;
        --muted: #9aa0a8;
        --border: #3a3f47;
        --accent: #7aa2f7;
        --accent-soft: rgba(122, 162, 247, 0.14);
        --accent-mid: rgba(122, 162, 247, 0.55);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.14);
        --ok: #4ade80;
        --ok-soft: rgba(74, 222, 128, 0.14);
        --warn: #fbbf24;
        --warn-soft: rgba(251, 191, 36, 0.14);
        --input-bg: #2b3037;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      margin: 0; padding: 20px 24px; line-height: 1.6;
      background: var(--bg); color: var(--text);
      font-size: 14px;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── 图标（feather 系，currentColor，随字） ── */
    .ic { width: 15px; height: 15px; flex: none; }
    .ic-sm { width: 12px; height: 12px; }
    .ic-wrap { display: inline-flex; align-items: center; }

    header.top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    header.top h1 { font-size: 18px; margin: 0; display: flex; align-items: center; }
    header.top .ver { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--accent); color: #fff; margin-right: 10px;
    }
    .logo .ic { width: 17px; height: 17px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ── 选项卡 ── */
    nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
    nav.tabs button.tabbtn {
      border: none; background: transparent; color: var(--muted);
      font-size: 14px; padding: 8px 16px; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      display: inline-flex; align-items: center; gap: 6px;
      transition: color 180ms var(--ease);
    }
    nav.tabs button.tabbtn.active {
      color: var(--accent); border-bottom-color: var(--accent); font-weight: 600;
    }
    nav.tabs button.tabbtn:hover { color: var(--text); }

    /* ── 通用按钮（图标+文字；hover 上浮反馈，active 下沉） ── */
    button.btn {
      font-size: 13px; padding: 5px 14px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--panel);
      color: var(--text); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background-color 180ms var(--ease), border-color 180ms var(--ease),
                  transform 150ms var(--ease), opacity 180ms var(--ease);
    }
    button.btn:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-1px); }
    button.btn:active { transform: translateY(0) scale(0.98); }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
    button.btn.danger { color: var(--danger); }
    button.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    button.btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    /* 次要操作：默认弱化，卡片/行 hover 或聚焦时显形（hover 显示操作） */
    .ops .btn.op-sec { opacity: 0.55; }
    .card:hover .ops .btn.op-sec,
    .task-row:hover .ops .btn.op-sec,
    .task-row:focus-within .ops .btn.op-sec,
    .ops .btn.op-sec:focus-visible { opacity: 1; }
    @media (hover: none) { .ops .btn.op-sec { opacity: 1; } }

    /* ── 卡片 ── */
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
    }
    .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-head h3 { margin: 0; font-size: 15px; }
    .card-head .ver { font-size: 12px; color: var(--muted); }
    .sg-ic {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--accent-soft); color: var(--accent); flex: none;
    }
    .sg-ic .ic { width: 16px; height: 16px; }

    /* ── 徽章（颜色+图标双通道；pill） ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 2px 10px;
      border-radius: 999px; line-height: 1.7; white-space: nowrap;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.muted { background: var(--border); color: var(--muted); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.danger { background: var(--danger-soft); color: var(--danger); }
    .badge.accent { background: var(--accent-soft); color: var(--accent); }

    /* ── 任务统计 mini 条（技能组卡片加料） ── */
    .statbar-wrap { margin-top: 10px; }
    .statbar {
      display: flex; height: 8px; border-radius: 999px;
      background: var(--border); overflow: hidden;
    }
    .stat-seg { height: 100%; min-width: 0; transition: flex-grow 250ms var(--ease); }
    .stat-seg.st-pending { background: var(--accent); }
    .stat-seg.st-claimed { background: var(--accent-mid); }
    .stat-seg.st-waiting { background: var(--warn); }
    .stat-seg.st-failed { background: var(--danger); }
    .stat-seg.st-cancelled { background: var(--muted); opacity: 0.6; }
    .stat-seg.st-done { background: var(--ok); }
    .statbar-empty {
      width: 100%; text-align: center; font-size: 11px; line-height: 8px;
      color: var(--muted); background: transparent; height: auto; padding: 2px 0;
    }
    .stat-legend {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-top: 6px; font-size: 12px; color: var(--muted);
    }
    .stat-legend .lg-item { display: inline-flex; align-items: center; gap: 5px; }
    .stat-legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .stat-legend .n { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    .summary { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .meta-line { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    .instruction {
      font-size: 13px; margin-top: 8px; padding: 8px 10px;
      background: var(--bg); border-radius: 6px;
      white-space: pre-wrap; word-break: break-word;
    }
    .ops { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .count { font-size: 13px; color: var(--muted); }
    .count strong { color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── 表单 ── */
    .form-wrap { border: 1px dashed var(--accent); border-radius: 10px; padding: 16px; margin-top: 12px; background: var(--panel); }
    .form-wrap h3 { margin: 0 0 12px; font-size: 15px; }
    .field { margin-bottom: 12px; }
    .field > label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .field > label .req { color: var(--danger); margin-left: 2px; }
    .field input[type="text"], .field textarea {
      width: 100%; font-size: 14px; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--input-bg); color: var(--text);
      font-family: inherit;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    }
    .field input[type="text"]:focus, .field textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .radio-row, .check-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 14px; }
    .coll-list {
      max-height: 180px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; margin: 6px 0; background: var(--input-bg);
    }
    .coll-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px; }
    .fixed-note { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── 任务列表 ── */
    details.status-group { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; }
    details.status-group summary {
      cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600;
      background: var(--bg); border-radius: 8px;
      display: flex; align-items: center; gap: 8px;
      list-style: none; transition: background-color 180ms var(--ease);
    }
    details.status-group summary::-webkit-details-marker { display: none; }
    details.status-group summary:hover { background: var(--accent-soft); }
    details.status-group[open] summary { border-radius: 8px 8px 0 0; }
    details.status-group summary .sum-ic { display: inline-flex; }
    details.status-group summary .chev { margin-left: auto; color: var(--muted); transition: transform 200ms var(--ease); display: inline-flex; }
    details.status-group[open] summary .chev { transform: rotate(180deg); }
    .task-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; padding: 8px 12px; border-top: 1px solid var(--border);
      font-size: 13px; transition: background-color 180ms var(--ease);
    }
    .task-row:hover { background: var(--accent-soft); }
    .task-row .ops { margin-top: 0; }
    .task-info { flex: 1; min-width: 0; }
    .task-none { padding: 10px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    .muted { color: var(--muted); font-size: 12px; }
    .reltime { cursor: default; }
    .err-inline {
      color: var(--danger); font-size: 12px; margin-top: 2px;
      word-break: break-word; display: flex; align-items: flex-start; gap: 5px;
    }
    .scan-prog { font-size: 13px; color: var(--accent); margin-top: 10px; display: flex; align-items: center; gap: 10px; }
    .scan-prog[hidden] { display: none; }
    .prog-track { flex: 1; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
    .prog-fill { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 250ms var(--ease); }
    .scan-prog .prog-text { white-space: nowrap; }

    /* ── MCP ── */
    .mcp-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
    .mcp-row .k { min-width: 88px; color: var(--muted); font-size: 13px; flex: none; }
    input.switch {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 22px; border-radius: 999px;
      background: var(--border); position: relative; cursor: pointer; margin: 0;
      transition: background-color 200ms var(--ease); border: none; padding: 0;
    }
    input.switch::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: transform 200ms var(--ease);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    input.switch:checked { background: var(--ok); }
    input.switch:checked::after { transform: translateX(18px); }
    .token-box, .url-box {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
      word-break: break-all; flex: 1; min-width: 0;
    }
    .notice {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      background: var(--warn-soft); color: var(--warn); font-size: 13px;
      display: flex; align-items: flex-start; gap: 8px;
    }

    /* ── 全局错误提示（图标+文案+关闭；role=alert） ── */
    #error-box {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--danger-soft); color: var(--danger);
      border: 1px solid var(--danger); border-radius: 8px;
      padding: 10px 14px; margin-bottom: 12px; font-size: 13px;
    }
    #error-box[hidden] { display: none; }
    #error-box .ic { margin-top: 3px; }
    .eb-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
    .eb-close {
      border: none; background: transparent; color: inherit; cursor: pointer;
      padding: 2px; display: inline-flex; border-radius: 6px;
    }
    .eb-close:hover { background: var(--danger-soft); filter: brightness(0.95); }

    /* ── 空状态（图标+引导文案+行动按钮） ── */
    .empty-state { text-align: center; padding: 48px 20px; }
    .empty-ic {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent); margin-bottom: 12px;
    }
    .empty-ic .ic { width: 26px; height: 26px; }
    .empty-state h3 { margin: 0 0 6px; font-size: 15px; }
    .empty-state p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
    .empty-state .btn { margin: 0 auto; }

    /* ── 骨架屏（按最终布局占位） ── */
    .skel {
      border-radius: 6px;
      background: linear-gradient(90deg, var(--border) 25%, var(--panel) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: skel-shimmer 1.2s linear infinite;
    }
    @keyframes skel-shimmer { to { background-position: -200% 0; } }
    .skel-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }

    /* ── 插件核心未就绪降级 ── */
    #not-ready { text-align: center; padding: 60px 20px; }
    #not-ready[hidden] { display: none; }
    #not-ready h3 { font-size: 15px; margin: 12px 0 6px; }
    #not-ready p { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    #not-ready .btn { margin: 0 auto; }

    /* ── 动效总开关 ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>
      <span class="logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>技能任务<span class="ver" id="ver"></span>
    </h1>
    <div class="row">
      <button class="btn" id="btn-refresh" title="重新加载全部数据"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>刷新</button>
      <button class="btn" id="btn-close" title="关闭管理面板"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>关闭</button>
    </div>
  </header>

  <!-- 全局错误提示（面板内所有异步操作失败时显示中文信息） -->
  <div id="error-box" hidden="hidden" role="alert">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span class="eb-text" id="error-text"></span>
    <button class="eb-close" id="error-close" title="关闭提示"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>

  <div id="main-ui">
    <nav class="tabs">
      <button class="tabbtn active" id="tabbtn-skills" data-tab="skills"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>技能组</button>
      <button class="tabbtn" id="tabbtn-tasks" data-tab="tasks"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>任务</button>
      <button class="tabbtn" id="tabbtn-mcp" data-tab="mcp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>MCP 服务</button>
    </nav>
    <main>
      <section id="tab-skills" class="tabpanel"></section>
      <section id="tab-tasks" class="tabpanel" hidden="hidden"></section>
      <section id="tab-mcp" class="tabpanel" hidden="hidden"></section>
    </main>
  </div>

  <!-- 插件核心未挂载时的降级提示 -->
  <div id="not-ready" hidden="hidden">
    <span class="empty-ic" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
    <h3>插件核心未就绪</h3>
    <p>SkillTask API 未挂载，请重启 Zotero 后重试。</p>
    <button class="btn" id="btn-notready-retry"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>重新加载</button>
  </div>

  <script src="panel.js"></script>
</body>
</html>
