name: Release XPI

on:
  push:
    branches:
      - main
      - 'beta/**'
    paths:
      - package.json
      - package-lock.json
      - addon/**
      - src/**
      - scripts/**
      - docs/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read and validate release version
        id: version
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { assertPublishBranch } from './scripts/release-config.mjs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const info = assertPublishBranch(version, process.env.RELEASE_BRANCH);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${info.version}\ntag=${info.tag}\n`);
          NODE

      - name: Check existing release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.existing.outputs.exists != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: npm test

      - name: Build and publish release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --publish
