name: Render README screenshots

on:
  push:
    branches:
      - docs/readme-ui-screenshots
    paths:
      - scripts/readme-screenshots/**
      - .github/workflows/readme-screenshots-temp.yml

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip screenshots]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-ui-screenshots

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on runner" >&2
            exit 1
          fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Render screenshots
        shell: bash
        run: |
          mkdir -p docs/images
          PAGE="file://$GITHUB_WORKSPACE/scripts/readme-screenshots/ui-preview.html"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1200,900 --screenshot="$GITHUB_WORKSPACE/docs/images/skills-overview.png" "$PAGE?view=skills"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1200,1050 --screenshot="$GITHUB_WORKSPACE/docs/images/skill-editor.png" "$PAGE?view=editor"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1200,950 --screenshot="$GITHUB_WORKSPACE/docs/images/tasks.png" "$PAGE?view=tasks"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1200,820 --screenshot="$GITHUB_WORKSPACE/docs/images/mcp-service.png" "$PAGE?view=mcp"

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "docs: render README interface screenshots [skip screenshots]"
          git push origin HEAD:docs/readme-ui-screenshots
