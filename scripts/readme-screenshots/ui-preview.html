<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Zotero Skill Task MCP UI Preview</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7;--panel:#fff;--text:#1f2329;--muted:#6b7280;--border:#dfe3e8;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.10);--accent-mid:rgba(37,99,235,.55);
  --danger:#dc2626;--danger-soft:rgba(220,38,38,.10);--ok:#16a34a;--ok-soft:rgba(22,163,74,.12);
  --warn:#b45309;--warn-soft:rgba(180,83,9,.12);--input-bg:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;min-height:900px;background:var(--bg)}
body{
  padding:20px 24px;color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,
  "Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header.top h1{font-size:18px;margin:0;display:flex;align-items:center}
.ver{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.logo,.sg-ic{
  display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent);
  background:var(--accent-soft);border-radius:8px;
}
.logo{width:30px;height:30px;background:var(--accent);color:#fff;margin-right:10px}
.sg-ic{width:30px;height:30px}
.icon{font-size:16px;line-height:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px}
nav.tabs span{
  color:var(--muted);font-size:14px;padding:8px 16px;border-bottom:2px solid transparent;margin-bottom:-2px
}
nav.tabs span.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.btn{
  font-size:13px;padding:5px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);display:inline-flex;align-items:center;gap:5px;white-space:nowrap
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:999px;line-height:1.7;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.muted{background:var(--border);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.danger{background:var(--danger-soft);color:var(--danger)}
.summary{font-size:13px;color:var(--muted);margin-top:6px}
.meta-line{font-size:12px;color:var(--muted);margin-top:8px}
.instruction{font-size:13px;margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:6px;white-space:pre-wrap}
.ops{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)}.count strong{color:var(--text);font-variant-numeric:tabular-nums}
.statbar-wrap{margin-top:10px}
.statbar{display:flex;height:8px;border-radius:999px;background:var(--border);overflow:hidden}
.seg{height:100%}.pending{background:var(--accent)}.claimed{background:var(--accent-mid)}.waiting{background:var(--warn)}
.failed{background:var(--danger)}.done{background:var(--ok)}
.stat-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.n{color:var(--text);font-weight:600}
.form-wrap{border:1px dashed var(--accent);border-radius:10px;padding:16px;background:var(--panel)}
.form-wrap h3{margin:0 0 12px;font-size:15px}
.field{margin-bottom:11px}.field>label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.req{color:var(--danger);margin-left:2px}
.input,.textarea,.select{
  width:100%;font-size:14px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--input-bg);color:var(--text)
}
.textarea{min-height:62px}.field-inline{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.field-inline .select{width:auto;min-width:190px}
.check,.radio{display:flex;align-items:center;gap:6px;margin:4px 0}
.hint,.muted{font-size:12px;color:var(--muted)}
.drop-zone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:78px;padding:12px;border:1.5px dashed var(--border);border-radius:10px;background:#fafbfc;color:var(--muted);text-align:center
}
.drop-zone strong{color:var(--text);font-size:13px}.drop-zone span{font-size:12px}
.upload-status{margin-top:7px;padding:7px 9px;border-radius:7px;background:#fafbfc;color:var(--muted);font-size:12px}
.references-box{margin:8px 0 0 26px;padding:10px 12px;border-left:2px solid var(--border)}
.upload-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.upload-file{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--border);border-radius:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.search{flex:1;padding:7px 11px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);color:var(--muted)}
.filter{padding:7px 8px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg)}
details.status-group{margin-top:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
details.status-group summary{padding:8px 12px;font-size:13px;font-weight:600;background:var(--bg);display:flex;align-items:center;gap:8px}
.task-item{border-top:1px solid var(--border)}.task-row{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px}
.task-info{flex:1;min-width:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.task-detail{margin:0 12px 10px 40px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13px}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;margin-bottom:4px}
.d-kv{display:flex;gap:4px;align-items:baseline}.d-kv .k{color:var(--muted);flex:none;font-size:12px}
.d-sec{margin-top:8px}.d-sec h4{margin:0 0 4px;font-size:12px;color:var(--muted)}.d-list{margin:0;padding-left:20px}
.timeline{list-style:none;margin:0;padding:0}.timeline li{display:flex;align-items:center;gap:8px;padding:2px 0}
.t-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mcp-row{display:flex;align-items:center;gap:10px;margin:10px 0}.mcp-row .k{min-width:88px;color:var(--muted);font-size:13px}
.switch{width:40px;height:22px;border-radius:999px;background:var(--border);position:relative;flex:none}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22)}
.switch.on{background:var(--ok)}.switch.on:after{transform:translateX(18px)}
.url-box,.token-box{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;flex:1}
.notice{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.audit-list{margin-top:6px}.audit-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
.audit-row:first-child{border-top:none}.audit-ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.audit-ic.ok{background:var(--ok-soft);color:var(--ok)}.audit-ic.accent{background:var(--accent-soft);color:var(--accent)}.audit-ic.danger{background:var(--danger-soft);color:var(--danger)}
.spacer{flex:1}
</style>
</head>
